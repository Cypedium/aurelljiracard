spring:
  application:
    name: jiraboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jiraboard}
    username: ${DB_USERNAME:jiraboard}
    password: ${DB_PASSWORD:}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  jwt:
    access-secret: ${JWT_SECRET}
    refresh-secret: ${REFRESH_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  google:
    # OAuth client id from Google Cloud Console; empty = "Sign in with Google" answers 503
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    # Resend (https://resend.com) API key; empty = registration and verification emails answer 503
    resend-api-key: ${RESEND_API_KEY:}
    # The sender; its domain must be verified in Resend (onboarding@resend.dev only reaches your own inbox)
    from: ${MAIL_FROM:AurellTodo <onboarding@resend.dev>}
    # The frontend: verification links point to <app-url>/verify-email/<token>
    app-url: ${APP_URL:http://localhost:3000}
    # Password reset emails are sent in the background, so the answer takes as long for every address
    async: true
  rate-limit:
    # Per client IP on the public /auth endpoints, and failed logins per account (in memory, per machine)
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Fly's proxy puts the caller's address here; without the header the connection's address is used
    client-ip-header: Fly-Client-IP
  cors:
    # Comma-separated
    allowed-origins: ${CLIENT_URL:http://localhost:3000,https://aurelltodo.com,https://www.aurelltodo.com,https://aurelljiraboard.fly.dev}
