spring:
  application:
    name: jiraboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jiraboard}
    username: ${DB_USERNAME:jiraboard}
    password: ${DB_PASSWORD:}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  jwt:
    access-secret: ${JWT_SECRET}
    refresh-secret: ${REFRESH_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  google:
    # OAuth client id from Google Cloud Console; empty = "Sign in with Google" answers 503
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    # Comma-separated, same as CLIENT_URL in server/app.js
    allowed-origins: ${CLIENT_URL:http://localhost:3000,https://aurelljiraboard.fly.dev}
