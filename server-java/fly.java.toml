app = "aurelljiraboardjava"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.java"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Public endpoint, no DB call; grace period covers JVM start + Flyway
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpus = 1
