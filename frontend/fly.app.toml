app = "aurelljiraboard"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.app"

[build.args]
  NEXT_PUBLIC_API_URL = "https://aurelljiraboardnode.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpus = 1
