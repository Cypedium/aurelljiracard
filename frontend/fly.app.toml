app = "aurelljiraboard"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.app"

[build.args]
  NEXT_PUBLIC_API_URL = "https://aurelljiraboardjava.fly.dev"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID = "145599098308-6ha337ja2suppeeus3ila1n8odubl7k5.apps.googleusercontent.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpus = 1
