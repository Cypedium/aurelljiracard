app = "aurelljiraboard"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.app"

[build.args]
  # api.aurelltodo.com = the server-java app (Fly certificate + CNAME to aurelljiraboardjava.fly.dev)
  NEXT_PUBLIC_API_URL = "https://api.aurelltodo.com"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID = "145599098308-6ha337ja2suppeeus3ila1n8odubl7k5.apps.googleusercontent.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpus = 1
